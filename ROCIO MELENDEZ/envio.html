<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Envío</title>

<style>
body{
font-family: Arial, sans-serif;
background:#979da5;
margin:0;
padding:0;
}

.container{
max-width:700px;
margin:auto;
background:rgb(134, 195, 199);
padding:25px;
margin-top:40px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:#333;
}

.status{
display:flex;
align-items:center;
margin:15px 0;
padding:10px;
border-radius:6px;
background:#f1f1f1;
}

.status.active{
background:#d4edda;
color:#56888f;
font-weight:bold;
}

.circle{
width:20px;
height:20px;
border-radius:50%;
background:#a79c9c;
margin-right:10px;
}

.active .circle{
background:rgb(7, 7, 7);
}

button{
background:#3178c4;
color:rgb(0, 0, 0);
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#6ba1db;
}

img{
width:100%;
margin-top:15px;
border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>📦 Seguimiento de Envío</h2>

<p><strong>Número de Orden:</strong> #45892</p>
<p><strong>Cliente:</strong> Juan Pérez</p>
<p><strong>Dirección:</strong> El Salvador, San Miguel, Colonia El Molino, Casa #12</p>
<p><strong>Conductor:</strong> Carlos López</p>

<div id="statusList">

<div class="status active">
<div class="circle"></div>
Admin creó el envío
</div>

<div class="status">
<div class="circle"></div>
Conductor asignado
</div>

<div class="status">
<div class="circle"></div>
En ruta
</div>

<div class="status">
<div class="circle"></div>
Entregado
</div>

<div class="status">
<div class="circle"></div>
Orden cerrada
</div>

</div>

<hr>

<h3>Panel del Conductor</h3>

<button onclick="nextStatus()">Actualizar Estado</button>

<br><br>

<label>Subir foto de entrega:</label>
<input type="file" onchange="mostrarFoto(event)">

<img id="fotoEntrega">

</div>

<script>

let estadoActual = 0;

function nextStatus(){

let estados = document.querySelectorAll(".status");

if(estadoActual < estados.length-1){
estadoActual++;
estados[estadoActual].classList.add("active");
}

}

function mostrarFoto(event){

let img = document.getElementById("fotoEntrega");
img.src = URL.createObjectURL(event.target.files[0]);

}

</script>

</body>
</html>
