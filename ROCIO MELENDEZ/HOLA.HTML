<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box {
    background:white;
    padding:30px;
    border-radius:15px;
    width:300px;
    text-align:center;
}

input {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    width:100%;
    padding:10px;
    background:#667eea;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="box">
<h2>🔐 Login</h2>

<input id="email" placeholder="Correo">
<input id="pass" type="password" placeholder="Contraseña">

<button onclick="login()">Entrar</button>
</div>

<script>
function login() {
    fetch("http://localhost:3000/login", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("pass").value
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.token) {
            localStorage.setItem("token", data.token);

            // Redirección por rol
            if (data.rol === "admin") {
                window.location = "admin.html";
            } else if (data.rol === "repartidor") {
                window.location = "repartidor.html";
            } else {
                window.location = "cliente.html";
            }

        } else {
            alert(data.error);
        }
    });
}
</script>

</body>
</html>
