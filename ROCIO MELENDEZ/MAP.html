<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubicación</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<style>
body { font-family: Arial; margin:0; background:#f4f4f4; }
header { background:#0d6efd; color:white; padding:15px; text-align:center; }
#panel {
  padding:15px;
  background:white;
}
input, button {
  padding:8px;
  margin:5px 0;
  width:100%;
}
button {
  background:#0d6efd;
  color:white;
  border:none;
  cursor:pointer;
}
#map { height:400px; }
.resultado {
  background:#e9ecef;
  padding:10px;
  margin-top:10px;
}
</style>
</head>
<body>

<header>
<h2>📦 Ubicación - El Salvador</h2>
</header>

<div id="panel">

<input type="text" id="origen" placeholder="Dirección de origen">
<input type="text" id="destino1" placeholder="Destino 1">
<input type="text" id="destino2" placeholder="Destino 2 (opcional)">
<input type="text" id="destino3" placeholder="Destino 3 (opcional)">

<button onclick="crearRuta()">Calcular Envío</button>

<div class="resultado" id="info">Esperando direcciones...</div>

</div>

<div id="map"></div>

<script>

const map = L.map('map').setView([13.6929, -89.2182], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
 attribution: '© OpenStreetMap'
}).addTo(map);

let controlRuta;

const precioPorKm = 0.50; // 💰 precio configurable

async function geocodificar(direccion) {

  const response = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion)}&countrycodes=sv&addressdetails=1&limit=1`
  );

  const data = await response.json();

  if (data.length === 0) {
    alert("Dirección no encontrada: " + direccion);
    return null;
  }

  return {
    latlng: L.latLng(data[0].lat, data[0].lon),
    direccionCompleta: `
      ${data[0].display_name}
    `
  };
}

async function crearRuta() {

  const direcciones = [
    document.getElementById("origen").value,
    document.getElementById("destino1").value,
    document.getElementById("destino2").value,
    document.getElementById("destino3").value
  ].filter(d => d.trim() !== "");

  if (direcciones.length < 2) {
    alert("Debes ingresar mínimo origen y un destino");
    return;
  }

  const puntos = [];

  for (let dir of direcciones) {
    const geo = await geocodificar(dir);
    if (!geo) return;
    puntos.push(geo.latlng);
  }

  if (controlRuta) map.removeControl(controlRuta);

  controlRuta = L.Routing.control({
    waypoints: puntos,
    routeWhileDragging: false,
    show: false,
    router: L.Routing.osrmv1({
      serviceUrl: 'https://router.project-osrm.org/route/v1',
      profile: 'driving',
      language: 'es'
    })
  }).addTo(map);

  controlRuta.on('routesfound', function(e) {

    const ruta = e.routes[0];
    const distanciaKm = ruta.summary.totalDistance / 1000;
    const tiempoMin = ruta.summary.totalTime / 60;
    const costo = distanciaKm * precioPorKm;

    document.getElementById("info").innerHTML = `
      📏 Distancia total: ${distanciaKm.toFixed(2)} km <br>
      ⏱ Tiempo estimado: ${tiempoMin.toFixed(0)} min <br>
      💰 Costo del envío: $${costo.toFixed(2)}
    `;

  });

}

</script>

</body>
</html>
