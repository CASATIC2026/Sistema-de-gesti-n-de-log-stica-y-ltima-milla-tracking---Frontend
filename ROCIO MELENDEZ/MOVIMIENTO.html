<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Seguimiento PRO NIVEL DIOS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { font-family: Arial; margin:0; }

.header {
  background: linear-gradient(90deg, orange, #ff6a00);
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 22px;
}

.controls {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: #eee;
}

input {
  padding: 10px;
  width: 250px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  background: orange;
  color: white;
  border: none;
  padding: 10px 15px;
  cursor: pointer;
  border-radius: 5px;
}

.estado {
  font-weight: bold;
}

#map { height: 500px; }
</style>
</head>

<body>

<div class="header">📦 Seguimiento de Pedido PRO</div>

<div class="controls">
  <input type="text" id="direccion" placeholder="Ej: Colonia Milagro de la Paz, San Miguel">
  <button onclick="iniciar()">Iniciar entrega</button>
  <div class="estado" id="estado">Estado: Esperando</div>
</div>

<div id="map"></div>

<script>

// 📍 BODEGA FIJA (San Miguel)
const bodega = [-88.1833, 13.4833]; // [lng, lat]

// Crear mapa
var map = L.map('map').setView([13.4833, -88.1833], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var marcadorBodega = L.marker([13.4833, -88.1833]).addTo(map)
  .bindPopup("📦 Bodega");

// Variables
let rutaCoords = [];
let repartidor;
let clienteMarker;

// 🔎 Convertir dirección a coordenadas
async function geocodificar(direccion) {
  let url = `https://nominatim.openstreetmap.org/search?format=json&q=${direccion}`;
  let res = await fetch(url);
  let data = await res.json();

  if (data.length === 0) {
    alert("Dirección no encontrada");
    return null;
  }

  return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
}

// 🚀 Iniciar proceso
async function iniciar() {

  const direccion = document.getElementById("direccion").value;

  if (!direccion) {
    alert("Escribe una dirección");
    return;
  }

  document.getElementById("estado").innerText = "Estado: Empaquetando 📦";

  let cliente = await geocodificar(direccion);
  if (!cliente) return;

  // Marcador cliente
  if (clienteMarker) map.removeLayer(clienteMarker);
  clienteMarker = L.marker(cliente).addTo(map).bindPopup("🏠 Cliente");

  // Crear ruta real
  let urlRuta = `https://router.project-osrm.org/route/v1/driving/${bodega[0]},${bodega[1]};${cliente[1]},${cliente[0]}?overview=full&geometries=geojson`;

  let res = await fetch(urlRuta);
  let data = await res.json();

  rutaCoords = data.routes[0].geometry.coordinates;

  // Dibujar ruta
  let rutaLatLng = rutaCoords.map(c => [c[1], c[0]]);
  L.polyline(rutaLatLng, {color: 'orange'}).addTo(map);

  map.fitBounds(rutaLatLng);

  // Repartidor
  if (repartidor) map.removeLayer(repartidor);
  repartidor = L.marker(rutaLatLng[0]).addTo(map).bindPopup("🚚 Repartidor");

  setTimeout(() => {
    document.getElementById("estado").innerText = "Estado: En camino 🚚";
    mover(rutaLatLng);
  }, 3000);
}

// 🚚 Movimiento REAL sobre la ruta
function mover(ruta) {

  let i = 0;

  let intervalo = setInterval(() => {

    if (i >= ruta.length) {
      clearInterval(intervalo);
      document.getElementById("estado").innerText = "Estado: Entregado ✅";
      return;
    }

    repartidor.setLatLng(ruta[i]);

    // Cerca del destino
    if (i > ruta.length * 0.8) {
      document.getElementById("estado").innerText = "Estado: Cerca del destino 📍";
    }

    i++;

  }, 200);
}

</script>

</body>
</html>
