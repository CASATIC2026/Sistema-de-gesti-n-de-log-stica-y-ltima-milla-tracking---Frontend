<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Seguimiento de Pedido</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
}

.panel{
background:white;
padding:15px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin:5px 0;
}

button{
background:#27ae60;
color:white;
border:none;
padding:10px;
cursor:pointer;
width:100%;
}

#map{
height:500px;
}

.estado{
margin-top:10px;
padding:10px;
background:#eafaf1;
border-left:5px solid green;
}

</style>
</head>

<body>

<header>
<h2>📦 Seguimiento de Pedido</h2>
</header>

<div class="panel">

<input id="origen" placeholder="Ubicación del repartidor">
<input id="destino" placeholder="Dirección del cliente">

<button onclick="crearRuta()">Calcular Ruta</button>

<div class="estado" id="estado">
Estado: esperando pedido
</div>

</div>

<div id="map"></div>

<script>

var map=L.map('map').setView([13.4833,-88.1833],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

var repartidor;

function geocode(dir){

return fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${dir}`)
.then(r=>r.json())

}

async function crearRuta(){

document.getElementById("estado").innerHTML="Estado: calculando ruta...";

var o=await geocode(document.getElementById("origen").value);
var d=await geocode(document.getElementById("destino").value);

var start=[o[0].lon,o[0].lat];
var end=[d[0].lon,d[0].lat];

var url=`https://api.openrouteservice.org/v2/directions/driving-car?api_key=TU_API_KEY&start=${start}&end=${end}`;

fetch(url)
.then(res=>res.json())
.then(data=>{

var coords=data.features[0].geometry.coordinates;

var ruta=coords.map(c=>[c[1],c[0]]);

L.polyline(ruta,{color:"blue",weight:5}).addTo(map);

map.fitBounds(ruta);

repartidor=L.marker(ruta[0]).addTo(map).bindPopup("🚚 Repartidor");

animar(ruta);

document.getElementById("estado").innerHTML="Estado: En camino 🚚";

});

}

function animar(ruta){

let i=0;

var intervalo=setInterval(()=>{

if(i>=ruta.length){

document.getElementById("estado").innerHTML="Estado: Pedido entregado ✅";

clearInterval(intervalo);

return;

}

repartidor.setLatLng(ruta[i]);

i++;

},1000);

}

</script>

</body>
</html>
