<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:1;
    padding:1;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    background: linear-gradient(135deg, #9fd3c7, #b7cece);
    display:flex;
    justify-content:center;
    padding:40px;
}

.container{
    background:rgb(81, 112, 102);
    width:1400px;
    border-radius:100px;
    padding:50px;
    box-shadow:0 40px 40px rgba(0,0,0,0.1);
    
}

/* NAVBAR */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logo{
    font-size:20px;
    font-weight:600;
}

.menu{
    display:flex;
    gap:25px;
    color:#050505;
    font-size:15px;
}

.btn{
    padding:7px 15px;
    border-radius:15px;
    border:1px solid #ccc;
    background:rgb(55, 132, 134);
    cursor:pointer;
}

/* HERO SECTION */

.hero{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    height:400px;
    margin-bottom:40px;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(100%);
}

.hero-content{
    position:absolute;
    top:40%;
    left:40%;
    transform:translate(-50%, -50%);
    text-align:center;
    color:rgb(0, 0, 0);
}
.navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:50px;
}

.menu{
    display:flex;
    gap:15px;
    font-size:14px;
    flex-wrap:nowrap; /* evita que se bajen */
}

.menu span{
    white-space:nowrap; /* evita que las palabras se partan */
}
.menu span{
    background:white;
    padding:8px 15px;
    border-radius:20px;
    border:1px solid #ddd;
    cursor:pointer;
    transition:0.3s;
    white-space:nowrap;
}

.menu span:hover{
    background:#64b8ab;
    color:white;
    border-color:#64b8ab;
}
.hero-content h1{
    font-size:32px;
    margin-bottom:20px;
}

.search-box{
    background:white;
    padding:10px 20px;
    border-radius:30px;
    display:flex;
    align-items:center;
    width:400px;
}

.search-box input{
    border:none;
    outline:none;
    flex:1;
    font-size:18px;
}

.search-box button{
    background:#64b8ab;
    border:none;
    color:white;
    padding:20px 20px;
    border-radius:50%;
    cursor:pointer;
}

/* PRODUCTS */

.section-title{
    font-weight:600;
    margin-bottom:20px;
}

.products{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:20px;
}

.card{
    border-radius:15px;
    overflow:hidden;
    background:#968a8a;
    transition:0.3s;
}

.card img{
    width:100%;
    height:155px;
    object-fit:cover;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(231, 5, 5, 0.1);
}
.carrusel{
    position:absolute;
    width:100%;
    height:100%;
}

.carrusel img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.carrusel .activa{
    display:block;
}

</style>
</head>

<body>

<div class="container">

    <div class="navbar">
        <div class="logo">HAPPY FINDS</div>
        <div class="menu">
            <span>Moda femenina</span>
            <span>Moda masculina</span>
            <span>Belleza</span>
            <span>Articulos para el hogar</span>
            <span>Tecnologia</span>
            <span>Deportes</span>
            <span>Juguetes</span>
            <span>Libros</span>


        </div>
        <button class="btn">Resgistrarse

        </button>
    </div>

    <div class="hero">
        <div class="carrusel">
  <img src="https://i.pinimg.com/736x/5a/bb/6b/5abb6b0fe4b6153e506fc30774cd7e9a.jpg" class="activa">
  <img src="https://i.pinimg.com/1200x/39/4a/85/394a8514c21be4c0fc80e3d2a9879019.jpg">
  <img src="https://i.pinimg.com/1200x/9f/b1/18/9fb118d3d637cf3ac9bba3343ac52e69.jpg">
   <img src="https://i.pinimg.com/736x/10/37/0b/10370b134c0af75e129449493bff61a4.jpg">
    <img src="https://i.pinimg.com/736x/23/99/82/239982b8a8bf7a74b1f0607ffe2cf70e.jpg">
    <img src="https://i.pinimg.com/736x/fb/76/04/fb76049acec4dfd8ecdd15160f7e9beb.jpg">
  <img src="https://i.pinimg.com/1200x/2b/e8/e2/2be8e2b7bad2220d306eaeb9a64a7f30.jpg">

  

</div>
        <div class="hero-content">
            <h1></h1>
            <div class="search-box">
                <input type="text" placeholder="Buscar productos y mas...">
                <button>➜</button>
            </div>
        </div>
    </div>

    <div class="section-title">Listado Reciente</div>

    <div class="products">
        <div class="card"><img src="https://i.pinimg.com/736x/6b/e6/ed/6be6ed90b426d3e616803f2eec133764.jpg"></div>
        <div class="card"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"></div>
        <div class="card"><img src="https://images.unsplash.com/photo-1515378791036-0648a3ef77b2"></div>
        <div class="card"><img src="https://i.pinimg.com/1200x/1d/08/f2/1d08f2e28a004e2b2ea767e734c0da2f.jpg"></div>
        <div class="card"><img src="https://i.pinimg.com/1200x/8c/9f/a7/8c9fa7dbc6e87d9a2d83c5bf0acf7874.jpg"></div>
       
    </div>

</div>
<script>
let i=0;
let imgs=document.querySelectorAll(".carrusel img");

setInterval(()=>{
  imgs[i].classList.remove("activa");
  i=(i+1)%imgs.length;
  imgs[i].classList.add("activa");
},3000);
</script>
 



</body>
</html>
